<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" routerLink="/" aria-label="yydevtools home">
      <span class="brand__mark material-icons-outlined" aria-hidden="true">bolt</span>
      <span class="brand__name">yydevtools</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Tools</a
      >
      <a class="nav__link" routerLink="/about" routerLinkActive="nav__link--active">About</a>
      <a
        class="nav__link"
        href="https://github.com/YehanYeshminda/yydevtools"
        target="_blank"
        rel="noopener"
      >
        GitHub
        <span class="nav__ext material-icons-outlined" aria-hidden="true">open_in_new</span>
      </a>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="
        theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
      "
      [attr.aria-pressed]="theme.theme() === 'dark'"
    >
      <span class="material-icons-outlined" aria-hidden="true">
        {{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>© {{ year }} yydevtools</span>
    <span class="footer__dot" aria-hidden="true">·</span>
    <span>Free utilities, no sign-up.</span>

    <nav class="footer__nav" aria-label="Legal">
      <a class="footer__link" routerLink="/about">About</a>
      <a class="footer__link" routerLink="/privacy">Privacy</a>
      <button type="button" class="footer__link footer__button" (click)="consent.reopen()">
        Cookie settings
      </button>
    </nav>
  </div>
</footer>

<app-consent-banner />
