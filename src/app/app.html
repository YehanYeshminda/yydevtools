<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" routerLink="/" aria-label="YYDevTools home">
      <!-- Inlined rather than an <img> so the mark paints with the first frame;
           the same geometry lives in public/logo.svg. -->
      <svg class="brand__mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
        <rect width="96" height="96" rx="28" fill="#FFBE3D" />
        <g stroke="#262A33" stroke-width="11" stroke-linecap="round" fill="none">
          <line x1="48" y1="22" x2="48" y2="74" />
          <line x1="70.5" y1="35" x2="25.5" y2="61" />
          <line x1="25.5" y1="35" x2="70.5" y2="61" />
        </g>
      </svg>
      <span class="brand__name">YYDevTools</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Tools</a
      >
      <a class="nav__link" routerLink="/guides" routerLinkActive="nav__link--active">Guides</a>
      <a class="nav__link" routerLink="/news" routerLinkActive="nav__link--active">News</a>
      <a class="nav__link" routerLink="/about" routerLinkActive="nav__link--active">About</a>
      <a
        class="nav__link"
        href="https://github.com/YehanYeshminda/yydevtools"
        target="_blank"
        rel="noopener"
      >
        GitHub
        <ng-icon class="nav__ext" aria-hidden="true" name="matOpenInNewOutline" />
      </a>
    </nav>

    <!-- The palette's only other way in is ⌘K/Ctrl-K, so without this button it
         is unreachable on a touch device and invisible everywhere else. The
         label and the hint collapse away on narrow screens, leaving an icon
         button the same size as the theme trigger beside it. -->
    <button
      type="button"
      class="bar-btn search-trigger"
      aria-label="Search tools"
      aria-haspopup="dialog"
      aria-keyshortcuts="Meta+K Control+K"
      (click)="palette.openPalette()"
    >
      <ng-icon class="search-trigger__icon" aria-hidden="true" name="matSearchOutline" />
      <span class="search-trigger__label">Search tools</span>
      <!-- aria-hidden because aria-keyshortcuts already announces the shortcut;
           read out as text it would arrive twice, and as glyphs. -->
      <kbd class="search-trigger__key" aria-hidden="true">{{ shortcutHint() }}</kbd>
    </button>

    <button
      type="button"
      class="bar-btn theme-toggle"
      [cdkMenuTriggerFor]="themeMenu"
      [cdkMenuPosition]="themeMenuPosition"
      [attr.aria-label]="'Colour theme: ' + activeThemeOption().label + '. Change it'"
    >
      <ng-icon aria-hidden="true" [name]="activeThemeOption().icon" />
    </button>

    <ng-template #themeMenu>
      <div class="theme-menu" cdkMenu aria-label="Colour theme">
        @for (option of themeOptions; track option.value) {
          <button
            type="button"
            class="theme-menu__item"
            cdkMenuItemRadio
            [cdkMenuItemChecked]="theme.preference() === option.value"
            (cdkMenuItemTriggered)="theme.set(option.value)"
          >
            <ng-icon class="theme-menu__icon" aria-hidden="true" [name]="option.icon" />
            <span>{{ option.label }}</span>
            <ng-icon class="theme-menu__check" aria-hidden="true" [name]="theme.preference() === option.value ? 'matCheckOutline' : ''" />
          </button>
        }
      </div>
    </ng-template>

    <!-- The same five links as the primary nav, surfaced through a menu at phone
         widths where the inline row would overflow the bar. The nav above stays
         in the DOM (CSS-hidden below 640px) so the links remain in the
         prerendered HTML for crawlers; this is purely a small-screen affordance. -->
    <button
      type="button"
      class="bar-btn nav-trigger"
      [cdkMenuTriggerFor]="navMenu"
      [cdkMenuPosition]="themeMenuPosition"
      aria-label="Navigation menu"
    >
      <ng-icon aria-hidden="true" name="matMenuOutline" />
    </button>

    <ng-template #navMenu>
      <div class="nav-menu" cdkMenu aria-label="Primary">
        <a
          class="nav-menu__item"
          cdkMenuItem
          routerLink="/"
          routerLinkActive="nav-menu__item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Tools</a
        >
        <a class="nav-menu__item" cdkMenuItem routerLink="/guides" routerLinkActive="nav-menu__item--active">Guides</a>
        <a class="nav-menu__item" cdkMenuItem routerLink="/news" routerLinkActive="nav-menu__item--active">News</a>
        <a class="nav-menu__item" cdkMenuItem routerLink="/about" routerLinkActive="nav-menu__item--active">About</a>
        <a
          class="nav-menu__item"
          cdkMenuItem
          href="https://github.com/YehanYeshminda/yydevtools"
          target="_blank"
          rel="noopener"
        >
          GitHub
          <ng-icon class="nav__ext" aria-hidden="true" name="matOpenInNewOutline" />
        </a>
      </div>
    </ng-template>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<!-- Always in the DOM so prerender and hydration agree; the strip only paints
     once headlines load (browser-only), and `suppressed` keeps it out of the
     pages where it would be redundant without touching that first render. -->
<app-news-feed variant="strip" [limit]="4" [suppressed]="!showNewsStrip()" />

<footer class="footer">
  <div class="footer__inner">
    <span>© {{ year }} YYDevTools</span>
    <span class="footer__dot" aria-hidden="true">·</span>
    <span>Free utilities, no sign-up.</span>

    <nav class="footer__nav" aria-label="Legal">
      <a class="footer__link" routerLink="/guides">Guides</a>
      <a class="footer__link" routerLink="/news">News</a>
      <a class="footer__link" routerLink="/about">About</a>
      <a class="footer__link" routerLink="/contact">Contact</a>
      <a class="footer__link" routerLink="/privacy">Privacy</a>
      <button type="button" class="footer__link footer__button" (click)="consent.reopen()">
        Cookie settings
      </button>
    </nav>
  </div>
</footer>

<app-command-palette #palette />

<app-consent-banner />
