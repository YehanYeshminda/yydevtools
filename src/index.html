<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YYDevTools — Free developer utilities</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Per-route description, canonical, robots and social tags are written by
       SeoService and baked in at prerender time. This is only the fallback. -->
  <meta name="description" content="Free developer and PDF tools that run in your browser — JSON, JWT, Base64, hashing, image compression and PDF editing. No account, no upload, no install.">
  <!-- Confirms site ownership to AdSense; pairs with the loader script below and
       /ads.txt. Both are read by the crawler during the review. -->
  <meta name="google-adsense-account" content="ca-pub-5448994963877777">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f15" media="(prefers-color-scheme: dark)">
  <!-- Brand mark, generated from public/logo.svg by scripts/generate-icons.mjs.
       The .ico stays first for older browsers; anything modern prefers the SVG. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong colours.
    (function () {
      try {
        // Anything that is not an explicit 'light'/'dark' — including the
        // stored 'system' preference and a first visit with nothing stored —
        // follows the OS. Keep this in sync with core/theme.service.ts.
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' || (stored !== 'light'
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script>
    // Google Consent Mode v2 defaults. These must be in place BEFORE any ad
    // script loads, so they live here rather than in the Angular bundle;
    // ConsentService sends the matching 'update' once a choice is made.
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(['consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    }]);
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://yydevtools.com/#organization",
          "name": "YYDevTools",
          "url": "https://yydevtools.com/",
          "description": "Free developer and PDF tools that run in your browser.",
          "logo": "https://yydevtools.com/icon-512.png",
          "sameAs": ["https://github.com/YehanYeshminda/yydevtools"]
        },
        {
          "@type": "WebSite",
          "@id": "https://yydevtools.com/#website",
          "name": "YYDevTools",
          "url": "https://yydevtools.com/",
          "description": "Free developer and PDF tools that run in your browser — JSON, JWT, Base64, hashing, image compression and PDF editing. No account, no upload, no install.",
          "publisher": { "@id": "https://yydevtools.com/#organization" }
        }
      ]
    }
  </script>
  <!-- Google AdSense loader. Consent Mode defaults (above) are already in place,
       so this can load unconditionally; it will not read/write ad cookies until
       the visitor grants consent via the banner. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5448994963877777"
    crossorigin="anonymous"></script>
  <!-- Self-hosted variable fonts (see @font-face in styles.css): no third-party
       connection, and the two Latin faces are preloaded so text does not swap. -->
  <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!-- Entry splash: the mark draws itself, the name types out, the veil lifts.
       Lives here, not in Angular, so it paints with the first frame of a full
       page load and never runs on in-app navigation. Removed from the DOM once
       it has played; skipped entirely under prefers-reduced-motion. -->
  <div id="splash" aria-hidden="true">
    <svg class="splash__mark" viewBox="0 0 96 96" focusable="false">
      <rect width="96" height="96" rx="10" fill="#FFBE3D" />
      <g stroke="#262A33" stroke-width="11" stroke-linecap="round" fill="none">
        <line class="splash__stroke" pathLength="1" x1="48" y1="22" x2="48" y2="74" />
        <line class="splash__stroke" pathLength="1" x1="70.5" y1="35" x2="25.5" y2="61" />
        <line class="splash__stroke" pathLength="1" x1="25.5" y1="35" x2="70.5" y2="61" />
      </g>
    </svg>
    <span class="splash__name">YYDevTools<span class="splash__cursor">_</span></span>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #f5f3ee;
      color: #16171d;
      pointer-events: none;
      animation: splash-lift 0.35s ease-in 1s forwards;
    }
    [data-theme='dark'] #splash {
      background: #0e0f15;
      color: #f2f0ea;
    }
    .splash__mark {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 8px;
      animation: splash-pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
    }
    .splash__stroke {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: splash-draw 0.28s ease-out forwards;
    }
    .splash__stroke:nth-child(2) { animation-delay: 0.14s; }
    .splash__stroke:nth-child(3) { animation-delay: 0.28s; }
    .splash__name {
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      font: 700 1.5rem/1 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: -0.02em;
      animation: splash-type 0.4s steps(10, end) 0.3s forwards;
    }
    .splash__cursor {
      color: #ffbe3d;
      animation: splash-blink 0.5s steps(2, start) infinite;
    }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes splash-type { to { width: 7.2em; } }
    @keyframes splash-blink { to { visibility: hidden; } }
    @keyframes splash-lift { to { opacity: 0; transform: translateY(-2%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash { display: none; }
    }
  </style>
  <script>
    // Take the veil out of the DOM once it has lifted, so nothing can ever sit
    // behind an invisible full-screen layer. The timer covers the case where
    // the animation never runs (reduced motion, or a browser without it).
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var remove = function () { if (splash.parentNode) splash.parentNode.removeChild(splash); };
      splash.addEventListener('animationend', function (e) { if (e.target === splash) remove(); });
      setTimeout(remove, 1800);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
