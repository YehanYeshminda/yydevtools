# Fly.io app for the LibreOffice convert service. Scale-to-zero like the others.
#
#   fly launch --no-deploy
#   fly secrets set CONVERT_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "yydevtools-pdf-convert"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # "suspend" rather than "stop": a stopped machine boots the container from
  # scratch, which measured 9.6s for compress and 19.9s for OCR and convert on
  # the /health endpoint alone, before any work started. Suspend snapshots the
  # machine's memory instead and resumes it in about a second.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # LibreOffice is a whole office suite per invocation and is not fond of
    # parallelism even with separate user profiles. The service enforces the
    # same ceiling itself (MAX_CONCURRENT) as a backstop.
    type = "requests"
    hard_limit = 3
    soft_limit = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
