# Fly.io app for the LibreOffice convert service. Scale-to-zero like the others.
#
#   fly launch --no-deploy
#   fly secrets set CONVERT_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "yydevtools-pdf-convert"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # LibreOffice is heavy and not fond of parallelism; keep it low.
    type = "requests"
    hard_limit = 4
    soft_limit = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
