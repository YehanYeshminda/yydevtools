# Fly.io app for the sharp image-compression service. Scale-to-zero.
#
#   fly launch --no-deploy
#   fly secrets set IMAGE_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "yydevtools-image-compress"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
