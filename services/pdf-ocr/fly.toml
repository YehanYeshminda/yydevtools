# Fly.io app for the ocrmypdf OCR service. Scale-to-zero like the others.
#
#   fly launch --no-deploy
#   fly secrets set OCR_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "yydevtools-pdf-ocr"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 8

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  # OCR is CPU- and memory-heavy on multi-page scans.
  memory = "2gb"
