# Fly.io app for the ocrmypdf OCR service. Scale-to-zero like the others.
#
#   fly launch --no-deploy
#   fly secrets set OCR_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "yydevtools-pdf-ocr"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # "suspend" rather than "stop": a stopped machine boots the container from
  # scratch, which measured 9.6s for compress and 19.9s for OCR and convert on
  # the /health endpoint alone, before any work started. Suspend snapshots the
  # machine's memory instead and resumes it in about a second.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # ocrmypdf forks a Tesseract process per page and holds page rasters in
  # memory. Ten concurrent jobs would exhaust 2 GB long before the proxy ever
  # thought about shedding load, so the limit is set to what the machine can
  # genuinely survive; Fly starts another machine rather than overloading this
  # one. The service enforces the same ceiling itself (MAX_CONCURRENT) as a
  # backstop for anything that gets past the proxy.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 3
    soft_limit = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  # OCR is CPU- and memory-heavy on multi-page scans.
  memory = "2gb"
